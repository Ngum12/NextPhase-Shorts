name: Backend tests
on:
  push:
    paths: ['apps/api/**', 'scripts/smoke_e2e.py', 'scripts/smoke_object_store.py', 'scripts/smoke_broker_queue.py', 'scripts/configure_queue.py', 'scripts/retention_smoke.py', 'scripts/smoke_account_deletion.py', 'scripts/smoke_worker_recovery.py', 'scripts/operations_smoke.py', 'scripts/smoke_auth_recovery.py', 'scripts/smoke_session_refresh.py', 'scripts/smoke_email_delivery.py', 'scripts/mail_fixture_worker.py', 'scripts/configure_auth_email.py', 'scripts/capacity_exercise.py', 'scripts/smoke_restore_journal.py', 'scripts/private_staging_smoke.py', 'scripts/consolidated_acceptance.py', 'scripts/activate_private_staging.ps1', 'deploy/private-staging/**', 'compose.yaml', 'compose.restore-journal.yaml', 'compose.private-staging.yaml', 'compose.vps-trial.yaml', 'compose.trial-https.yaml', 'deploy/trial-https/**', 'scripts/smoke_trial_https.py', 'scripts/vps_trial.py', 'scripts/vps_maintenance.py', 'scripts/analyze_short.py', 'scripts/preview_short.py', 'scripts/smoke_analysis.py', '.github/scripts/ensure_ffmpeg.sh', '.github/workflows/backend.yml']
  pull_request:
    paths: ['apps/api/**', 'scripts/smoke_e2e.py', 'scripts/smoke_object_store.py', 'scripts/smoke_broker_queue.py', 'scripts/configure_queue.py', 'scripts/retention_smoke.py', 'scripts/smoke_account_deletion.py', 'scripts/smoke_worker_recovery.py', 'scripts/operations_smoke.py', 'scripts/smoke_auth_recovery.py', 'scripts/smoke_session_refresh.py', 'scripts/smoke_email_delivery.py', 'scripts/mail_fixture_worker.py', 'scripts/configure_auth_email.py', 'scripts/capacity_exercise.py', 'scripts/smoke_restore_journal.py', 'scripts/private_staging_smoke.py', 'scripts/consolidated_acceptance.py', 'scripts/activate_private_staging.ps1', 'deploy/private-staging/**', 'compose.yaml', 'compose.restore-journal.yaml', 'compose.private-staging.yaml', 'compose.vps-trial.yaml', 'compose.trial-https.yaml', 'deploy/trial-https/**', 'scripts/smoke_trial_https.py', 'scripts/vps_trial.py', 'scripts/vps_maintenance.py', 'scripts/analyze_short.py', 'scripts/preview_short.py', 'scripts/smoke_analysis.py', '.github/scripts/ensure_ffmpeg.sh', '.github/workflows/backend.yml']
concurrency:
  group: backend-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextphase
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: nextphase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextphase -d nextphase_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify or install FFmpeg with bounded package downloads
        timeout-minutes: 8
        run: bash .github/scripts/ensure_ffmpeg.sh
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Consolidated SQLite backups, HTTPS, operations and review acceptance
        if: matrix.database == 'sqlite'
        run: python scripts/consolidated_acceptance.py
      - run: python -m pytest apps/api/tests -q
        if: matrix.database == 'postgres'
        env:
          PYTHONPATH: apps/api
          NEXTPHASE_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://nextphase:localdev@127.0.0.1:5432/nextphase_test' || '' }}
      - name: Official PyPI installed-version advisory review
        if: matrix.database == 'sqlite'
        run: python scripts/python_advisories.py --output .data/python-advisories-ci.json
      - name: Experimental manual-transcript planning smoke
        if: matrix.database == 'sqlite'
        run: python scripts/smoke_analysis.py
      - name: Real HTTP and separate worker smoke
        run: python scripts/smoke_e2e.py
      - name: Durable broker restart and private S3 upload/render/download
        if: matrix.database == 'sqlite'
        run: python scripts/smoke_broker_queue.py --s3
      - name: Disposable 100-request capacity burst and restore drill
        if: matrix.database == 'sqlite'
        run: python scripts/capacity_exercise.py --soak-seconds 30
      - name: Backup-before-deletion protected pg_dump restore
        if: matrix.database == 'postgres'
        run: python scripts/smoke_restore_journal.py --postgres --encrypted-backup
      - name: Retain sanitized local S3 startup diagnostics
        if: failure() && matrix.database == 'sqlite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-startup-diagnostics
          path: .data/nextphase-s3-smoke-*/server.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain disposable capacity PostgreSQL state
        if: failure() && matrix.database == 'sqlite'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-postgres-state
          path: .data/capacity-exercise-*/postgres-state.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
